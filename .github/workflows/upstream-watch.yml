name: Upstream watch

# Once a day, opens an issue when FreeRDP tags a new 3.x release or OpenSSL a
# new release on the pinned line. On pull requests that change the watch, it
# only says what it would open. See docs/UPDATING-FREERDP.md.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/upstream-watch.yml
      - scripts/upstream-watch.sh

permissions:
  contents: read

jobs:
  watch:
    name: Check for new FreeRDP and OpenSSL releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pins with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VISTARA_WATCH_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: scripts/upstream-watch.sh
