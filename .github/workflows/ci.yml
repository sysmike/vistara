name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One Xcode for every job, so the libraries CI tests are the ones releases
# ship. The version is part of the cache keys: a new toolchain rebuilds.
env:
  XCODE_VERSION: "26.6"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freerdp:
    name: Build FreeRDP
    runs-on: macos-26
    # Two architectures, built one after the other, when nothing is cached.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build key
        id: key
        run: echo "key=$(scripts/build-freerdp.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Restore FreeRDP prefix
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/freerdp/prefix
          key: freerdp-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ steps.key.outputs.key }}

      - name: Build FreeRDP
        run: scripts/build-freerdp.sh

      - name: Show result
        run: |
          ls -l build/freerdp/prefix/lib
          for lib in build/freerdp/prefix/lib/lib{freerdp3,freerdp-client3,winpr3,ssl,crypto}.dylib; do
            lipo -info "$lib"
            otool -L "$lib"
          done

  app:
    name: Build, test, and lint
    needs: freerdp
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute build key
        id: key
        run: echo "key=$(scripts/build-freerdp.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Restore FreeRDP prefix
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/freerdp/prefix
          key: freerdp-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ steps.key.outputs.key }}
          fail-on-cache-miss: true

      - name: Compute test server key
        id: server-key
        run: echo "key=$(scripts/build-test-server.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Restore test server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-server/prefix
          key: test-server-${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ steps.server-key.outputs.key }}

      - name: Build test server
        run: scripts/build-test-server.sh

      - name: Compute test gateway key
        id: gateway-key
        run: echo "key=$(scripts/build-test-gateway.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Restore test gateway
        id: gateway-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-gateway/bin
          key: test-gateway-${{ runner.os }}-${{ runner.arch }}-${{ steps.gateway-key.outputs.key }}

      - name: Build test gateway
        if: steps.gateway-cache.outputs.cache-hit != 'true'
        run: |
          command -v go >/dev/null || brew install go
          scripts/build-test-gateway.sh

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint lint --strict

      # How the system draws the icon in each appearance, for the pull request:
      # Icon Composer's ictool renders the .icon as macOS does.
      - name: Draw the app icon in each appearance
        run: |
          ictool="$DEVELOPER_DIR/../Applications/Icon Composer.app/Contents/Executables/ictool"
          mkdir -p build/screenshots
          for rendition in Default Dark TintedLight TintedDark ClearLight ClearDark; do
            "$ictool" App/Resources/AppIcon.icon --export-image --output-file "build/screenshots/app-icon-$rendition.png" \
              --platform macOS --rendition "$rendition" --width 512 --height 512 --scale 1 >/dev/null
          done

      - name: Check that the lint forbids print
        run: |
          probe=App/Sources/LintProbe.swift
          printf 'func probe() {\n    print("x")\n}\n' > "$probe"
          if swiftlint lint --strict --quiet "$probe"; then
            echo "error: the no_direct_logging rule did not catch print" >&2
            rm -f "$probe"
            exit 1
          fi
          rm -f "$probe"

      - name: Test VistaraCore
        run: swift test --package-path Packages/VistaraCore

      # Without a server the integration tests must be skipped, not failed.
      - name: Integration tests are skipped without a server
        run: |
          set -o pipefail
          mkdir -p build
          swift test --package-path Packages/RDPKit --filter IntegrationTests 2>&1 | tee build/skipped.log
          grep -E 'Suite "?IntegrationTests"? skipped' build/skipped.log
          grep -E 'Suite "?LoggingIntegrationTests"? skipped' build/skipped.log

      - name: Start test server
        run: scripts/run-test-server.sh >> "$GITHUB_ENV"

      - name: Start test gateway
        run: scripts/run-test-gateway.sh >> "$GITHUB_ENV"

      # FreeRDP's own client, so a fault in the gateway setup is not taken
      # for a fault in Vistara.
      - name: Check the test gateway with FreeRDP's client
        run: scripts/check-test-gateway.sh

      - name: Test RDPKit against the test server
        env:
          # FreeRDP's redacted log lines also go to the CI log.
          VISTARA_LOG_STDERR: "1"
        run: swift test --package-path Packages/RDPKit

      - name: Show test server log
        if: always()
        run: cat build/test-server/run/server.log || true

      - name: Show test gateway log
        if: always()
        run: cat build/test-gateway/run/gateway.log || true

      # A test process that crashes leaves only its signal in the log; the
      # crashed thread's frames say where.
      - name: Show crash reports
        if: failure()
        run: |
          # ReportCrash writes the report some seconds after the crash.
          # A name that starts with a dot is a report still being written.
          for _ in $(seq 1 45); do
            reports=$(find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
              -name '[!.]*.ips' -mmin -15 2>/dev/null | head -3)
            [[ -n "$reports" ]] && break
            sleep 2
          done
          echo "reports: ${reports:-none}"
          for report in $reports; do
            echo "== $report"
            python3 - "$report" <<'PY'
          import glob, json, os, subprocess, sys
          lines = open(sys.argv[1]).read().split("\n", 1)
          try:
              body = json.loads(lines[1])
          except ValueError:
              print(lines[1][:20000])
              sys.exit(0)
          images = body.get("usedImages", [])
          tables = {}
          def nearest(path, offset):
              # The closest symbol at or before the offset, from nm, for a
              # bundle whose text starts at 0 or at the usual 4 GB.
              if not os.path.exists(path):
                  # Reports hide the user's folder; find the binary by name.
                  found = glob.glob(f"Packages/*/.build/*/debug/*/Contents/MacOS/{os.path.basename(path)}")
                  path = found[0] if found else path
              if path not in tables:
                  out = subprocess.run(["nm", "-n", "--defined-only", path], capture_output=True, text=True).stdout
                  tables[path] = [(int(a, 16), n) for a, _, n in (l.split(" ", 2) for l in out.splitlines() if l.count(" ") >= 2)]
              table = tables[path]
              for base in (0, 0x100000000):
                  before = [entry for entry in table if entry[0] <= base + offset]
                  if before and base + offset - before[-1][0] < 0x10000:
                      name = subprocess.run(["xcrun", "swift-demangle", "--simplified", before[-1][1]],
                                            capture_output=True, text=True).stdout.strip()
                      return f"{name} +{base + offset - before[-1][0]}"
              return f"{path} offset {hex(offset)}"

          print(body.get("exception"), body.get("termination", {}).get("indicator"))
          for thread in body.get("threads", []):
              if not thread.get("triggered"):
                  continue
              frames = thread.get("frames", [])
              print("thread:", thread.get("name"), thread.get("queue"), "sp:", thread.get("threadState", {}).get("sp"))
              print(f"{len(frames)} frames; the first 30 and the last 15:")
              for frame in frames[:30] + frames[-15:]:
                  used = images[frame["imageIndex"]] if frame.get("imageIndex") is not None else {}
                  symbol = frame.get("symbol")
                  if symbol is None and used.get("name"):
                      # Frames without a symbol: ask atos, with the image's load address.
                      symbol = nearest(used.get("path", used["name"]), frame.get("imageOffset", 0))
                  print(f'{used.get("name", "?"):24} {symbol} +{frame.get("symbolLocation", 0)}'
                        f' {frame.get("sourceFile", "")}:{frame.get("sourceLine", "")}')
          PY
          done

      - name: Generate project
        # Also after a failed package test, so one run reports both.
        if: ${{ !cancelled() }}
        run: xcodegen generate

      - name: Build app
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build -project Vistara.xcodeproj -scheme Vistara -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData

      - name: Check hardened runtime and sandbox
        if: ${{ !cancelled() }}
        run: |
          app=build/DerivedData/Build/Products/Debug/Vistara.app
          codesign --verify --strict "$app"
          # Xcode leaves the runtime flag off ad hoc signatures, so check the
          # build setting here. The signed release build is checked in #34.
          xcodebuild -project Vistara.xcodeproj -scheme Vistara -showBuildSettings |
            grep -E '^ +ENABLE_HARDENED_RUNTIME = YES$'
          entitlements="$(codesign --display --entitlements - "$app" 2>/dev/null)"
          echo "$entitlements"
          grep -q 'com.apple.security.app-sandbox' <<<"$entitlements"
          # Sound plays without the microphone: never ask for it.
          if grep -qE 'com\.apple\.security\.device\.(audio-input|microphone)' <<<"$entitlements"; then
            echo "error: the app must not ask for the microphone" >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist" >/dev/null 2>&1; then
            echo "error: Info.plist must not describe microphone use" >&2
            exit 1
          fi

      # The tests run inside the sandboxed app and connect to the test server.
      - name: Test app
        if: ${{ !cancelled() }}
        env:
          TEST_RUNNER_VISTARA_TEST_RDP_HOST: ${{ env.VISTARA_TEST_RDP_HOST }}
          TEST_RUNNER_VISTARA_TEST_RDP_PORT: ${{ env.VISTARA_TEST_RDP_PORT }}
          TEST_RUNNER_VISTARA_TEST_RDP_USER: ${{ env.VISTARA_TEST_RDP_USER }}
          TEST_RUNNER_VISTARA_TEST_RDP_PASSWORD: ${{ env.VISTARA_TEST_RDP_PASSWORD }}
          TEST_RUNNER_VISTARA_TEST_RDP_ALLOW_FAILED_LOGINS: ${{ env.VISTARA_TEST_RDP_ALLOW_FAILED_LOGINS }}
          # The sandboxed tests cannot read the log; they only learn it is the test server.
          TEST_RUNNER_VISTARA_TEST_SERVER_LOG: ${{ env.VISTARA_TEST_SERVER_LOG }}
          # Screenshots of real windows: the sandboxed tests cannot capture the
          # screen, so they ask this step, which can. See App/Tests/Screenshots.swift.
          TEST_RUNNER_VISTARA_SCREEN_CAPTURE: "1"
        run: |
          capture_windows() {
            shopt -s nullglob
            while true; do
              for request in "$HOME"/Library/Containers/*/Data/tmp/vistara-capture/*.request; do
                picture="${request%.request}.png"
                screencapture -x -o -l"$(cat "$request")" "$picture.part.png" &&
                  mv "$picture.part.png" "$picture"
                rm -f "$request"
              done
              sleep 0.1
            done
          }
          capture_windows &
          capturer=$!
          status=0
          xcodebuild test -project Vistara.xcodeproj -scheme Vistara -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData || status=$?
          kill "$capturer"
          exit "$status"

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          find "$HOME/Library/Containers" -type d -name vistara-screenshots -exec cp -R {}/. build/screenshots/ \; 2>/dev/null || true
          ls -l build/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: warn

      # What ships: a Release build with an arm64 and an x86_64 slice in the
      # app and in every library it embeds.
      - name: Build universal release
        run: |
          xcodebuild build -project Vistara.xcodeproj -scheme Vistara -configuration Release \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build/DerivedDataRelease
          app=build/DerivedDataRelease/Build/Products/Release/Vistara.app
          status=0
          for binary in "$app/Contents/MacOS/Vistara" "$app"/Contents/Frameworks/*.dylib; do
            archs="$(lipo -archs "$binary")"
            echo "$(basename "$binary"): $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || status=1
          done
          du -sh "$app"
          exit $status

      - name: Launch the x86_64 slice
        run: |
          app=build/DerivedDataRelease/Build/Products/Release/Vistara.app
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is not installed on this runner; the x86_64 slice was built but not launched."
            exit 0
          fi
          arch -x86_64 "$app/Contents/MacOS/Vistara" &
          sleep 8
          pgrep -x Vistara
          pkill -x Vistara

      - name: Launch app
        run: |
          app=build/DerivedData/Build/Products/Debug/Vistara.app
          otool -L "$app"/Contents/MacOS/* | grep '@rpath/libfreerdp3.3.dylib'
          # Hide the build prefix so the app can only load its embedded copies.
          mv build/freerdp/prefix build/freerdp/prefix.hidden
          open "$app"
          sleep 8
          pgrep -x Vistara
          pkill -x Vistara
