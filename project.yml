# The Xcode project is generated from this file and is not committed:
#   xcodegen generate
name: Vistara

options:
  bundleIdPrefix: io.github.sysmike
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  RDPKit:
    path: Packages/RDPKit
  VistaraCore:
    path: Packages/VistaraCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Vistara:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # The app icon: an Icon Composer file, from which Xcode also makes the
      # icon for macOS 14 and 15.
      - App/Resources
    dependencies:
      - package: RDPKit
        product: RDPKit
      - package: RDPKit
        product: RDPKitUI
      - package: VistaraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sysmike.vistara
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Vistara.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Ad hoc signing for local and CI builds. Xcode applies the hardened
        # runtime only with a real identity, which arrives with issue #34.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed FreeRDP
        script: '"$SRCROOT/scripts/embed-freerdp.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - VistaraTests

  # Runs inside the app, so the tests see real windows and the sandbox.
  VistaraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: Vistara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sysmike.vistara.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
